<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Icon Studio">
  <!--
    Referenced twice: the <link rel="icon"> in client/index.html and the
    "logo" field of the HairSalon JSON-LD. Both pointed at a file that did not
    exist, so the tab icon was blank and the structured-data logo resolved to a
    404. SVG is an accepted logo format for Google's structured data.

    Brand colours match client/src/index.css: rose #C9757A, gold #B8902A,
    cream #FAF6F1. Serif stack mirrors the Fraunces display face without
    depending on a webfont, which a favicon cannot load.
  -->
  <rect width="64" height="64" rx="14" fill="#C9757A" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="#B8902A" stroke-width="1.5" opacity="0.65" />
  <text
    x="32"
    y="41.5"
    font-family="Fraunces, Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="600"
    letter-spacing="-0.5"
    text-anchor="middle"
    fill="#FAF6F1"
  >IS</text>
  <rect x="23" y="47" width="18" height="2" rx="1" fill="#B8902A" />
</svg>
