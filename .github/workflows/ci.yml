name: CI

# The repo previously had no CI at all — the only quality gate was running
# `tsc --noEmit` by hand. This runs the same checks on every PR so a type error
# or a failing test cannot reach main unnoticed.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` on Linux skips the win32 rollup binary in optionalDependencies
      # automatically (npm honours the os/cpu constraints), so the platform pin
      # added for local Windows builds is inert here.
      - run: npm ci

      # Covers client, server and the api/ functions — see the root typecheck
      # script, which fans out to all three tsconfigs.
      - run: npm run typecheck

      # ESLint over client, server, api and shared. The Deno code has its own
      # linter in the check:edge step below.
      - run: npm run lint

      - run: npm run test

      # The Iris Edge Function is Deno, not Node, so it needs its own runtime
      # and its own runner. Without these two steps the whole chat pipeline —
      # the pre-filter, the intent enum, the no-numbers guard — would have no
      # CI gate at all, which is exactly the code that must not regress
      # silently.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm run check:edge

      - run: npm run test:edge
